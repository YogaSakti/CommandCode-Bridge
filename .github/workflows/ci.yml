name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - if: runner.os != 'Windows'
        run: go test -race ./...
      - if: runner.os != 'Windows'
        run: sh ./scripts_test.sh
      - if: runner.os == 'Windows'
        shell: bash
        run: ./scripts/build.sh dev ./dist
