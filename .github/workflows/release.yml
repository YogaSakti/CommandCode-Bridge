name: Release assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-amd64
            runner: macos-15-intel
            ext: dylib
          - target: darwin-arm64
            runner: macos-15
            ext: dylib
          - target: windows-amd64
            runner: windows-latest
            ext: dll
          - target: windows-arm64
            runner: windows-11-arm
            ext: dll
          - target: linux-amd64
            runner: ubuntu-latest
            ext: so
          - target: linux-arm64
            runner: ubuntu-24.04-arm
            ext: so
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install zip
        if: runner.os == 'Windows'
        run: choco install zip -y
      - name: Build and package
        shell: bash
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          version=${VERSION#v}
          ./scripts/build.sh "$version" ./dist
          ./scripts/package.sh "$version" "./dist/commandcode-bridge.${{ matrix.ext }}" ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/commandcode-bridge_*.zip
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd artifacts
          sha256sum commandcode-bridge_*.zip | sort -k2 > checksums.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/commandcode-bridge_*.zip
            artifacts/checksums.txt
